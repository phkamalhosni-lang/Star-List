<style>
:root{
  --ink:#231F20; --ink-2:#4A4546; --ink-3:#77716F;
  --yellow:#FBD729; --yellow-soft:#FFF6C7;
  --paper:#F4F4F2; --white:#FFFFFF; --line:rgba(35,31,32,.12);
  --green:#146B3E; --green-bright:#1F8F55; --green-soft:#E2F3E9;
  --red:#B3261E; --red-soft:#FBE6E4;
  --amber:#8A5A00; --amber-soft:#FFEFC2;
  --serif:'Fraunces', Georgia, 'Times New Roman', serif;
  --sans:'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:120px}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
::selection{background:var(--yellow);color:var(--ink)}
.wrap{max-width:1300px;margin:0 auto;padding:0 6vw}

/* Header */
header{background:var(--yellow);border-bottom:5px solid var(--ink);padding:34px 0 26px}
.head{display:flex;align-items:center;gap:24px}
.logo{width:100px;height:100px;flex-shrink:0;background:var(--ink);border-radius:22px;padding:10px}
.head h1{font-family:var(--serif);font-weight:700;font-size:clamp(32px,5vw,56px);line-height:1;letter-spacing:-.01em}
.head p{margin-top:10px;font-size:15px;line-height:1.55;max-width:60ch;color:var(--ink-2)}
.meta{display:flex;flex-wrap:wrap;gap:12px 30px;margin-top:22px;align-items:center}
.meta .m b{font-family:var(--serif);font-size:24px;display:block;line-height:1.1}
.meta .m span{font-size:12.5px;color:var(--ink-2)}
.updated{margin-left:auto;background:var(--ink);color:var(--yellow);border-radius:999px;padding:8px 15px;font-size:13px;font-weight:600}

/* Sticky tabs + toolbar */
.sticky{position:sticky;top:0;z-index:30;background:var(--white);border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:none;border-bottom:4px solid transparent;padding:15px 12px 11px;font-weight:600;font-size:14.5px;color:var(--ink-3);white-space:nowrap;display:flex;align-items:center;gap:8px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--yellow)}
.tab .sm{display:none}
.tab .cnt{background:var(--green-soft);color:var(--green);font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 8px}
.bar{display:flex;gap:10px;padding:12px 0;align-items:center;border-top:1px solid var(--line)}
.search{flex:1;position:relative}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink-3);pointer-events:none}
.search input{width:100%;padding:11px 14px 11px 38px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:15px;background:var(--white);color:var(--ink)}
.search input:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px var(--yellow)}
.btn{border:1px solid var(--line);background:var(--white);border-radius:10px;padding:10px 14px;font-size:13.5px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--yellow);border-color:var(--ink)}
.btn[hidden]{display:none}

main .wrap{padding-top:28px;padding-bottom:80px}
h2{font-family:var(--serif);font-size:24px;font-weight:700;line-height:1.2}
.note{color:var(--ink-3);font-size:14px;margin:6px 0 22px;line-height:1.5}

/* Pills */
.pill{display:inline-flex;align-items:center;font-size:11px;font-weight:700;border-radius:999px;padding:3px 8px;white-space:nowrap;vertical-align:middle;line-height:1.3}
.pill.new{background:var(--green-bright);color:#fff}
.pill.new-soft{background:var(--green-soft);color:var(--green)}
.pill.gone{background:var(--red);color:#fff}
.pill.pts{background:var(--amber-soft);color:var(--amber)}

/* Department cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.dcard{background:var(--white);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:14px;padding:18px;text-align:left;display:flex;flex-direction:column;gap:4px;transition:transform .12s ease}
.dcard:hover{transform:translateY(-2px);border-color:var(--ink);border-left-color:var(--accent)}
.dcard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.dcard .nm{font-family:var(--serif);font-size:19px;font-weight:700}
.dcard .ar{font-size:13px;color:var(--ink-3);direction:rtl}
.dcard .row{display:flex;justify-content:space-between;align-items:flex-end;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);gap:10px}
.dcard .n{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--accent);line-height:1}
.dcard .n small{display:block;font-family:var(--sans);font-size:12px;font-weight:500;color:var(--ink-3);margin-top:4px}
.dcard .br{font-size:12px;color:var(--ink-3);text-align:right;max-width:150px;line-height:1.4}

/* Accordions */
.list{display:flex;flex-direction:column;gap:8px}
.acc{background:var(--white);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.acc-h{width:100%;background:none;border:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px;text-align:left}
.acc-h:hover{background:var(--yellow-soft)}
.acc.open > .acc-h{background:var(--yellow-soft)}
.acc-h .l{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:600;font-size:15px}
.chev{font-size:10px;color:var(--ink-3);transition:transform .15s ease;display:inline-block}
.acc.open .chev{transform:rotate(90deg);color:var(--ink)}
.count{font-size:12.5px;font-weight:600;color:var(--ink-2);background:var(--paper);border-radius:999px;padding:3px 10px;white-space:nowrap}
.acc-b{border-top:1px solid var(--line)}
.prow{display:flex;align-items:center;gap:14px;padding:10px 16px 10px 40px;font-size:14px;border-top:1px solid rgba(35,31,32,.05)}
.prow:first-child{border-top:none}
.prow .sap{font-size:12px;color:var(--ink-3);width:58px;flex-shrink:0;font-variant-numeric:tabular-nums}
.prow .nm{flex:1;display:flex;align-items:center;gap:8px;flex-wrap:wrap;line-height:1.35}
.pts-v{font-size:13px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.pts-v small{font-weight:500;color:var(--ink-3)}
.pts-v.old{color:var(--ink-3);text-decoration:line-through;font-weight:500}
.chg{font-size:13px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.chg .from{color:var(--ink-3);font-weight:500}
.chg.up .to{color:var(--green-bright)} .chg.down .to{color:var(--red)}

/* Search results */
.rrow{display:flex;align-items:center;gap:14px;background:var(--white);border:1px solid var(--line);border-radius:10px;padding:11px 16px;font-size:14px}
.rrow .tag{font-size:11px;font-weight:700;border:1.5px solid var(--accent);color:var(--accent);border-radius:999px;padding:3px 9px;white-space:nowrap}
.rrow .bd{color:var(--ink-3);width:120px;flex-shrink:0;font-size:12.5px}
.rrow .nm{flex:1;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rrow .sap{font-size:12px;color:var(--ink-3)}
.empty{color:var(--ink-3);padding:40px 0;text-align:center;font-size:15px}
.more{color:var(--ink-3);font-size:13px;text-align:center;padding:16px 0 0}

/* Monthly changes */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{position:relative;background:var(--yellow);border-radius:18px 18px 18px 4px;border-bottom:5px solid var(--ink);padding:16px 18px 14px}
.kpi::after{content:'';position:absolute;top:16px;right:16px;width:11px;height:11px;background:var(--ink);border-radius:3px;transform:rotate(45deg)}
.kpi .l{font-size:13px;font-weight:600;color:var(--ink-2)}
.kpi .v{font-family:var(--serif);font-size:32px;font-weight:700;line-height:1.1;margin-top:8px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--ink-2);margin-top:4px}
.kpi.up .v{color:var(--green)} .kpi.down .v{color:var(--red)}
.ctl{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:28px 0 14px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{border:2px solid var(--line);background:var(--white);border-radius:12px;padding:10px 16px;font-weight:600;font-size:14px;display:flex;gap:8px;align-items:center}
.seg button .c{font-size:12px;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--paper)}
.seg .a:hover{border-color:var(--green-bright)} .seg .r:hover{border-color:var(--red)} .seg .p:hover{border-color:var(--ink)}
.seg .a.on{background:var(--green-bright);border-color:var(--green-bright);color:#fff}
.seg .r.on{background:var(--red);border-color:var(--red);color:#fff}
.seg .p.on{background:var(--ink);border-color:var(--ink);color:var(--yellow)}
.seg .on .c{background:rgba(255,255,255,.22);color:inherit}
.exp{display:flex;gap:8px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.chips button{border:1px solid var(--line);background:var(--white);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500}
.chips button.on{background:var(--ink);color:var(--white);border-color:var(--ink)}
.chips button span{color:var(--ink-3);margin-left:4px}
.chips button.on span{color:var(--yellow)}
.cdept{background:var(--white);border:1px solid var(--line);border-top:4px solid var(--tone);border-radius:14px;margin-bottom:14px;overflow:hidden}
.cdept-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:14px 18px}
.cdept-h .t{font-family:var(--serif);font-size:19px;font-weight:700}
.cdept-h .t span{font-family:var(--sans);font-size:13px;font-weight:500;color:var(--ink-3);margin-left:8px}
.cdept-h .c{font-weight:700;color:var(--tone);font-size:15px;white-space:nowrap}
.cdept .acc{border:none;border-top:1px solid var(--line);border-radius:0}
.tone-a{--tone:var(--green-bright)} .tone-r{--tone:var(--red)} .tone-p{--tone:var(--ink)}

/* Top Points */
.tab-top{background:var(--ink);color:var(--yellow)!important;border-radius:10px 10px 0 0;margin-left:6px;padding-left:14px;padding-right:14px}
.tab-top:hover{color:#fff!important}
.tab-top.on{border-bottom-color:var(--yellow)}
.top-hero{background:var(--ink);color:#fff;border-radius:18px 18px 18px 4px;padding:22px 24px;margin-bottom:22px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.top-hero h2{color:var(--yellow)}
.top-hero p{color:rgba(255,255,255,.78);font-size:14px;line-height:1.55;margin-top:6px;max-width:68ch}
.top-hero .rule{background:var(--yellow);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:13px;font-weight:600;line-height:1.5}
.trow td{vertical-align:middle}
.rank{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;font-weight:700;font-size:13px;background:var(--paper)}
.rank.g{background:var(--yellow);transform:rotate(45deg);border-radius:6px;width:26px;height:26px}
.rank.g span{transform:rotate(-45deg)}
.scorecell{display:flex;align-items:center;gap:10px;min-width:150px}
.scorebar{flex:1;height:8px;background:var(--paper);border-radius:6px;overflow:hidden}
.scorebar i{display:block;height:100%;background:var(--ink);border-radius:6px}
.scorecell b{font-family:var(--serif);font-size:18px;min-width:38px;text-align:right}
.pill.star{background:var(--yellow);color:var(--ink)}
.pill.rew{background:var(--ink);color:var(--yellow)}
.pill.mix{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.top-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}

/* Branch table */
.tbl-wrap{overflow-x:auto;background:var(--white);border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;min-width:520px}
th{font-size:12px;font-weight:700;color:var(--ink-2);text-align:left;padding:12px 16px;background:var(--yellow-soft);border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap}
th.num,td.num{text-align:right}
td{padding:11px 16px;font-size:14px;border-top:1px solid rgba(35,31,32,.05);font-variant-numeric:tabular-nums}
tr.me{background:var(--yellow-soft);box-shadow:inset 5px 0 0 var(--yellow)}
tr.me td{font-weight:700}
.sums{display:flex;gap:34px;flex-wrap:wrap;margin-bottom:20px}
.sums b{font-family:var(--serif);font-size:26px;display:block}
.sums span{font-size:12.5px;color:var(--ink-3)}

footer{border-top:1px solid var(--line);padding:22px 0;color:var(--ink-3);font-size:12.5px}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}

@media (max-width:640px){
  header{padding:24px 0 20px}
  .logo{width:68px;height:68px;border-radius:16px;padding:7px}
  .head{gap:14px}
  .head p{font-size:14px}
  .updated{margin-left:0}
  .prow{padding-left:16px;flex-wrap:wrap;gap:6px 12px}
  .prow .nm{flex-basis:100%;order:3}
  .rrow{flex-wrap:wrap;gap:6px 10px}
  .rrow .bd{width:auto}
  .rrow .nm{flex-basis:100%}
  .kpi .v{font-size:26px}
  .scorebar,.c-type{display:none} .scorecell{min-width:0} .tbl-wrap table{min-width:0} .trow td,.tbl-wrap th{padding:10px 8px}
  .tab .lg{display:none} .tab .sm{display:inline}
  .tab{padding:14px 9px 10px;font-size:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const MY_SITE = 2149;

const REMOVED = C.removed.map(a => ({sap:a[0], name:a[1], division:a[2], brand:a[3], basic:a[4], total:a[5]}));
const ADDED = new Set(C.added);
const OLDPTS = new Map(C.points.map(x => [x[0], {basic:x[1], total:x[2]}]));
const key = (d,b) => d + '||' + b;
const NEWBRAND = new Set(C.newBrands.map(x => key(x[1], x[0])));
const DROPBRAND = new Set(C.droppedBrands.map(x => key(x[1], x[0])));
const NEWDIV = new Set(C.newDivisions || []);

const ACCENTS = {'Make Up':'#A73865','Skin Care':'#3F7A57','Personal Care':'#2F6585','Hair Care':'#9C5A2E','Inner Beauty':'#6B4E8E','Medicine':'#2F5A4C','Mother & Baby':'#A06A1E','Health Care':'#3F6474','Foods & Beverages':'#7C5A2E','Sports':'#8A5A2E','Travel':'#4F5F70'};
const AR = {'Make Up':'المكياج','Skin Care':'العناية بالبشرة','Personal Care':'العناية الشخصية','Hair Care':'العناية بالشعر','Inner Beauty':'الجمال الداخلي','Medicine':'الأدوية','Mother & Baby':'الأم والطفل','Health Care':'الرعاية الصحية','Foods & Beverages':'أطعمة ومشروبات','Sports':'رياضة','Travel':'السفر'};
const acc = d => ACCENTS[d] || '#555';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n).toLocaleString('en-US');
const has = v => v !== null && v !== undefined && v !== '';

/* ---------- Product structure ---------- */
const DIVS = {};
P.forEach(p => {
  const d = DIVS[p.division] || (DIVS[p.division] = {name:p.division, count:0, added:0, brands:{}});
  d.count++; if (ADDED.has(p.sap)) d.added++;
  (d.brands[p.brand] || (d.brands[p.brand] = [])).push(p);
});
const DIVLIST = Object.values(DIVS).sort((a,b) => b.count - a.count);
const BRANDCOUNT = new Set(P.map(p => p.brand)).size;

/* ---------- State ---------- */
const S = {tab:'products', pview:'home', pdiv:null, cview:'added', cdiv:'All', q:''};
const $main = document.getElementById('main');
const $q = document.getElementById('q');
const $back = document.getElementById('backBtn');

document.getElementById('meta').innerHTML = `
  <div class="m"><b>${fmt(P.length)}</b><span>Star products</span></div>
  <div class="m"><b>${DIVLIST.length}</b><span>Departments</span></div>
  <div class="m"><b>${fmt(BRANDCOUNT)}</b><span>Brands</span></div>
  <div class="updated">Updated ${esc(C.dateLabel)}</div>`;
document.getElementById('tabCnt').textContent = '+' + fmt(C.added.length);
document.getElementById('foot').textContent = `${fmt(P.length)} products, updated ${C.dateLabel}`;

function ptsHtml(p){
  const b = has(p.basic), t = has(p.total);
  if (!b && !t) return '';
  if (!t) return `<span class="pts-v">${p.basic} <small>pt base</small></span>`;
  if (!b || p.basic === p.total) return `<span class="pts-v">${p.total} <small>pt</small></span>`;
  return `<span class="pts-v">${p.total} <small>pt (${p.basic} base)</small></span>`;
}
function badges(p){
  let h = '';
  if (ADDED.has(p.sap)) h += '<span class="pill new">NEW</span>';
  const o = OLDPTS.get(p.sap);
  if (o) h += `<span class="pill pts" title="Was ${o.total ?? o.basic} pt, base ${o.basic ?? '-'}">Points updated</span>`;
  return h;
}

/* ---------- Products tab ---------- */
function renderHome(){
  $back.hidden = true;
  let h = `<h2>Browse by department</h2><p class="note">Sorted by number of Star products. Green tags show what was added in the last update.</p><div class="grid">`;
  DIVLIST.forEach(d => {
    const bn = Object.keys(d.brands).sort((a,b) => d.brands[b].length - d.brands[a].length);
    const tag = NEWDIV.has(d.name) ? '<span class="pill new">NEW</span>' : (d.added ? `<span class="pill new-soft">+${fmt(d.added)} new</span>` : '');
    h += `<button class="dcard" style="--accent:${acc(d.name)}" data-div="${esc(d.name)}">
      <div class="top"><div><div class="nm">${esc(d.name)}</div><div class="ar">${AR[d.name]||''}</div></div>${tag}</div>
      <div class="row"><div class="n">${fmt(d.count)}<small>products</small></div><div class="br">${bn.length} brands<br>${esc(bn.slice(0,3).join(', '))}</div></div>
    </button>`;
  });
  $main.innerHTML = h + '</div>';
  $main.querySelectorAll('.dcard').forEach(c => c.onclick = () => { S.pview = 'division'; S.pdiv = c.dataset.div; render(); window.scrollTo({top:0}); });
}

function renderDivision(){
  const d = DIVS[S.pdiv];
  $back.hidden = false;
  const bn = Object.keys(d.brands).sort((a,b) => d.brands[b].length - d.brands[a].length);
  let h = `<h2 style="color:${acc(d.name)}">${esc(d.name)} <span style="font-family:var(--sans);font-size:15px;font-weight:500;color:var(--ink-3)">${AR[d.name]||''}</span></h2>
    <p class="note">${fmt(d.count)} products across ${bn.length} brands${d.added ? `, ${fmt(d.added)} added in the last update` : ''}. Open a brand to see its products.</p><div class="list">`;
  bn.forEach(b => {
    const items = d.brands[b];
    const nNew = items.filter(p => ADDED.has(p.sap)).length;
    const tag = NEWBRAND.has(key(d.name, b)) ? '<span class="pill new">NEW BRAND</span>' : (nNew ? `<span class="pill new-soft">+${nNew} new</span>` : '');
    h += `<div class="acc" data-b="${esc(b)}"><button class="acc-h"><span class="l"><span class="chev">▶</span>${esc(b)}${tag}</span><span class="count">${items.length}</span></button><div class="acc-b" hidden></div></div>`;
  });
  $main.innerHTML = h + '</div>';
  wireAcc(el => {
    const items = d.brands[el.dataset.b].slice().sort((a,b) => (ADDED.has(b.sap) - ADDED.has(a.sap)) || a.name.localeCompare(b.name));
    return items.map(p => `<div class="prow"><span class="sap">${p.sap}</span><span class="nm">${esc(p.name)}${badges(p)}</span>${ptsHtml(p)}</div>`).join('');
  });
}

function renderSearch(q){
  $back.hidden = true;
  const s = q.trim().toLowerCase();
  const m = P.filter(p => p.name.toLowerCase().includes(s) || p.brand.toLowerCase().includes(s) || String(p.sap).includes(s));
  const LIM = 150;
  let h = `<h2>Search results</h2><p class="note">${fmt(m.length)} ${m.length===1?'match':'matches'} for "${esc(q)}"</p>`;
  if (!m.length) { $main.innerHTML = h + '<div class="empty">No products match. Try a shorter word or check the spelling.</div>'; return; }
  h += '<div class="list">';
  m.slice(0, LIM).forEach(p => {
    h += `<div class="rrow"><span class="tag" style="--accent:${acc(p.division)}">${esc(p.division)}</span><span class="bd">${esc(p.brand)}</span><span class="nm">${esc(p.name)}${badges(p)}</span><span class="sap">${p.sap}</span>${ptsHtml(p)}</div>`;
  });
  h += '</div>';
  if (m.length > LIM) h += `<div class="more">Showing the first ${LIM} of ${fmt(m.length)}. Add more words to narrow it down.</div>`;
  $main.innerHTML = h;
}

function wireAcc(fill){
  $main.querySelectorAll('.acc').forEach(el => {
    const head = el.querySelector('.acc-h'), body = el.querySelector('.acc-b');
    head.onclick = () => {
      const open = !el.classList.contains('open');
      if (open && !body.dataset.f) { body.innerHTML = fill(el); body.dataset.f = 1; }
      el.classList.toggle('open', open); body.hidden = !open;
    };
  });
}

/* ---------- Monthly changes tab ---------- */
const VIEWS = {
  added:   {label:'Added',          cls:'a', tone:'tone-a', rows:() => P.filter(p => ADDED.has(p.sap))},
  removed: {label:'Removed',        cls:'r', tone:'tone-r', rows:() => REMOVED},
  points:  {label:'Points changed', cls:'p', tone:'tone-p', rows:() => P.filter(p => OLDPTS.has(p.sap))}
};
function matchQ(p, s){ return !s || p.name.toLowerCase().includes(s) || p.brand.toLowerCase().includes(s) || String(p.sap).includes(s); }

function kpis(){
  const net = C.after - C.before;
  const g = C.before ? net / C.before * 100 : 0;
  const sign = n => n > 0 ? '+' : (n < 0 ? '−' : '');
  return `<div class="kpis">
    <div class="kpi"><div class="l">Before</div><div class="v">${fmt(C.before)}</div><div class="s">Previous list</div></div>
    <div class="kpi"><div class="l">After</div><div class="v">${fmt(C.after)}</div><div class="s">Current list</div></div>
    <div class="kpi up"><div class="l">Added</div><div class="v">+${fmt(C.added.length)}</div><div class="s">${C.newBrands.length} brands new to a department</div></div>
    <div class="kpi down"><div class="l">Removed</div><div class="v">−${fmt(C.removed.length)}</div><div class="s">${C.droppedBrands.length} brands left a department</div></div>
    <div class="kpi ${net>=0?'up':'down'}"><div class="l">Net change</div><div class="v">${sign(net)}${fmt(Math.abs(net))}</div><div class="s">${fmt(C.points.length)} products changed points</div></div>
    <div class="kpi ${g>=0?'up':'down'}"><div class="l">Growth</div><div class="v">${sign(g)}${Math.abs(g).toFixed(1)}%</div><div class="s">vs previous list</div></div>
  </div>`;
}

function renderChanges(){
  $back.hidden = true;
  const v = VIEWS[S.cview], s = S.q.trim().toLowerCase();
  const all = v.rows().filter(p => matchQ(p, s));
  const byDiv = {};
  all.forEach(p => (byDiv[p.division] = (byDiv[p.division] || 0) + 1));
  if (S.cdiv !== 'All' && !byDiv[S.cdiv]) S.cdiv = 'All';
  const rows = S.cdiv === 'All' ? all : all.filter(p => p.division === S.cdiv);

  let h = `<h2>Monthly changes</h2><p class="note">Last updated ${esc(C.dateLabel)}, compared with the previous list of ${fmt(C.before)} products.</p>${kpis()}
    <div class="ctl"><div class="seg">${Object.entries(VIEWS).map(([k,x]) => `<button class="${x.cls}${S.cview===k?' on':''}" data-v="${k}">${x.label}<span class="c">${fmt(x.rows().length)}</span></button>`).join('')}</div>
    <div class="exp"><button class="btn" id="xXlsx" title="Full report: summary, added, removed, points changed, brands">⬇ Excel</button><button class="btn" id="xCsv" title="The list shown below">⬇ CSV</button><button class="btn" id="xPng" title="Summary image for sharing">⬇ Image</button></div></div>`;
  const divs = Object.keys(byDiv).sort((a,b) => byDiv[b] - byDiv[a]);
  if (divs.length > 1) h += `<div class="chips"><button data-d="All" class="${S.cdiv==='All'?'on':''}">All departments<span>${fmt(all.length)}</span></button>${divs.map(d => `<button data-d="${esc(d)}" class="${S.cdiv===d?'on':''}">${esc(d)}<span>${fmt(byDiv[d])}</span></button>`).join('')}</div>`;

  if (!rows.length) {
    h += `<div class="empty">${s ? 'Nothing in this list matches your search.' : 'No changes of this type in the last update.'}</div>`;
  } else {
    const G = {};
    rows.forEach(p => { const d = G[p.division] || (G[p.division] = {}); (d[p.brand] || (d[p.brand] = [])).push(p); });
    const autoOpen = rows.length <= 60;
    Object.keys(G).sort((a,b) => cnt(G[b]) - cnt(G[a])).forEach(d => {
      const brands = Object.keys(G[d]).sort((a,b) => G[d][b].length - G[d][a].length);
      const sym = S.cview === 'added' ? '+' : (S.cview === 'removed' ? '−' : '');
      h += `<section class="cdept ${v.tone}"><div class="cdept-h"><div class="t">${esc(d)}<span>${brands.length} ${brands.length===1?'brand':'brands'}</span></div><div class="c">${sym}${fmt(cnt(G[d]))}</div></div>`;
      brands.forEach(b => {
        let tag = '';
        if (S.cview === 'added' && NEWBRAND.has(key(d,b))) tag = '<span class="pill new">NEW BRAND</span>';
        if (S.cview === 'removed' && DROPBRAND.has(key(d,b))) tag = '<span class="pill gone">Left this department</span>';
        h += `<div class="acc${autoOpen?' open':''}" data-d="${esc(d)}" data-b="${esc(b)}"><button class="acc-h"><span class="l"><span class="chev">▶</span>${esc(b)}${tag}</span><span class="count">${G[d][b].length}</span></button><div class="acc-b"${autoOpen?' data-f="1"':' hidden'}>${autoOpen ? itemRows(G[d][b]) : ''}</div></div>`;
      });
      h += '</section>';
    });
  }
  $main.innerHTML = h;
  $main.querySelectorAll('.seg button').forEach(b => b.onclick = () => { S.cview = b.dataset.v; S.cdiv = 'All'; renderChanges(); });
  $main.querySelectorAll('.chips button').forEach(b => b.onclick = () => { S.cdiv = b.dataset.d; renderChanges(); });
  wireAcc(el => itemRows(rows.filter(p => p.division === el.dataset.d && p.brand === el.dataset.b)));
  document.getElementById('xXlsx').onclick = exportXlsx;
  document.getElementById('xCsv').onclick = () => exportCsv(rows);
  document.getElementById('xPng').onclick = exportPng;
}
function cnt(o){ return Object.values(o).reduce((s,a) => s + a.length, 0); }
function itemRows(items){
  return items.slice().sort((a,b) => a.name.localeCompare(b.name)).map(p => {
    let right;
    if (S.cview === 'points') {
      const o = OLDPTS.get(p.sap);
      const useTotal = o.total !== p.total && has(o.total) && has(p.total);
      const ov = useTotal ? o.total : o.basic, nv = useTotal ? p.total : p.basic, u = useTotal ? 'pt' : 'pt base';
      right = `<span class="chg ${nv>ov?'up':(nv<ov?'down':'')}"><span class="from">${ov ?? '-'}</span> → <span class="to">${nv ?? '-'} ${u}</span></span>`;
    } else if (S.cview === 'removed') {
      right = has(p.total) || has(p.basic) ? `<span class="pts-v old">${p.total ?? p.basic} pt</span>` : '';
    } else right = ptsHtml(p);
    return `<div class="prow"><span class="sap">${p.sap}</span><span class="nm">${esc(p.name)}</span>${right}</div>`;
  }).join('');
}

/* ---------- Branch targets tab ---------- */
const BS = {key:'target', dir:-1};
const HASMGR = BR.some(b => b.manager);
function renderBranches(){
  $back.hidden = true;
  const s = S.q.trim().toLowerCase();
  let rows = BR.filter(b => !s || b.name.toLowerCase().includes(s) || String(b.site).includes(s) || (b.manager||'').toLowerCase().includes(s));
  rows = rows.slice().sort((a,b) => (BS.key === 'name' || BS.key === 'manager') ? String(a[BS.key]||'').localeCompare(String(b[BS.key]||'')) * BS.dir : (a[BS.key] - b[BS.key]) * BS.dir);
  const tt = BR.reduce((x,b) => x + b.target, 0), ti = BR.reduce((x,b) => x + b.incentive, 0);
  const arrow = k => BS.key === k ? (BS.dir > 0 ? ' ▲' : ' ▼') : '';
  let h = `<h2>${esc(BRANCH_PERIOD)} branch targets</h2><p class="note">${BR.length} branches. Search by branch, site code${HASMGR ? ' or area manager' : ''}, tap a column to sort. Your branch is highlighted.</p>
    <div class="sums"><div><b>${fmt(Math.round(tt))}</b><span>Total target (SAR)</span></div><div><b>${fmt(Math.round(ti))}</b><span>Total incentive pool (SAR)</span></div><div><b>${rows.length}</b><span>Branches shown</span></div></div>
    <div class="tbl-wrap"><table><thead><tr><th data-k="site">Site${arrow('site')}</th><th data-k="name">Branch${arrow('name')}</th>${HASMGR ? `<th data-k="manager">Area manager${arrow('manager')}</th>` : ''}<th class="num" data-k="target">Target (SAR)${arrow('target')}</th><th class="num" data-k="incentive">Incentive (SAR)${arrow('incentive')}</th></tr></thead><tbody>`;
  rows.forEach(b => { h += `<tr class="${b.site===MY_SITE?'me':''}"><td>${b.site}</td><td>${esc(b.name)}</td>${HASMGR ? `<td>${esc(b.manager||'')}</td>` : ''}<td class="num">${fmt(Math.round(b.target))}</td><td class="num">${fmt(Math.round(b.incentive))}</td></tr>`; });
  h += '</tbody></table></div>';
  if (!rows.length) h += '<div class="empty">No branch matches your search.</div>';
  $main.innerHTML = h;
  $main.querySelectorAll('th').forEach(th => th.onclick = () => {
    const k = th.dataset.k;
    if (BS.key === k) BS.dir *= -1; else { BS.key = k; BS.dir = (k === 'name' || k === 'manager') ? 1 : -1; }
    renderBranches();
  });
}

/* ---------- Top Points tab ---------- */
let TDEPT = TOPDEPTS[0];
function typePill(st, rw){
  if (st && rw) return `<span class="pill mix">STAR ${st} · Reward ${rw}</span>`;
  return st ? '<span class="pill star">STAR</span>' : '<span class="pill rew">Reward only</span>';
}
function topRows(){
  const s = S.q.trim().toLowerCase();
  return (TOP.depts[TDEPT]?.brands || []).map((b,i) => ({rank:i+1, brand:b[0], score:b[1], basic:b[2], prem:b[3], skus:b[4], star:b[5], rew:b[6]}))
    .filter(r => !s || r.brand.toLowerCase().includes(s));
}
function renderTop(){
  $back.hidden = true;
  if (!TOPDEPTS.length) { $main.innerHTML = '<div class="empty">No points data in this update.</div>'; return; }
  const d = TOP.depts[TDEPT], rows = topRows(), maxS = d.brands[0] ? d.brands[0][1] : 1;
  const wB = Math.round(TOP.wBasic * 100), wP = Math.round(TOP.wPrem * 100);
  let h = `<div class="top-hero"><div><h2>🏆 Top Points brands</h2><p>The ${TOP.topN} highest-earning brands in each department, ranked by points only. Use it to know which brands to recommend first.</p></div>
    <div class="rule">Score = ${wB}% Basic + ${wP}% Premium<br>Only one available? It is used as is.</div></div>
    <div class="chips">${TOPDEPTS.map(x => `<button data-d="${esc(x)}" class="${x===TDEPT?'on':''}">${esc(x)}<span>${Math.min(TOP.topN, TOP.depts[x].total)}</span></button>`).join('')}</div>
    <div class="top-bar"><p class="note" style="margin:0">${esc(TDEPT)}: top ${Math.min(TOP.topN, d.total)} of ${d.total} brands${d.min > 1 ? `, brands with at least ${d.min} products` : ''}. Same score? More products ranks first.</p>
    <div class="exp"><button class="btn" id="tXlsx" title="All departments">⬇ Excel</button><button class="btn" id="tCsv" title="This department">⬇ CSV</button><button class="btn" id="tPng" title="This department as an image">⬇ Image</button></div></div>`;
  if (!rows.length) { $main.innerHTML = h + '<div class="empty">No brand in this list matches your search.</div>'; wireTop(); return; }
  h += `<div class="tbl-wrap"><table><thead><tr><th>#</th><th>Brand</th><th>Score</th><th class="num">Basic</th><th class="num">Premium</th><th class="num">Products</th><th class="c-type">Type</th></tr></thead><tbody>`;
  rows.forEach(r => {
    h += `<tr class="trow"><td>${r.rank <= 3 ? `<span class="rank g"><span>${r.rank}</span></span>` : `<span class="rank">${r.rank}</span>`}</td>
      <td style="font-weight:600">${esc(r.brand)}</td>
      <td><div class="scorecell"><div class="scorebar"><i style="width:${Math.max(4, r.score / maxS * 100)}%"></i></div><b>${r.score}</b></div></td>
      <td class="num">${r.basic ?? '—'}</td><td class="num">${r.prem ?? '—'}</td><td class="num">${fmt(r.skus)}</td><td class="c-type">${typePill(r.star, r.rew)}</td></tr>`;
  });
  $main.innerHTML = h + '</tbody></table></div>';
  wireTop();
}
function wireTop(){
  $main.querySelectorAll('.chips button').forEach(b => b.onclick = () => { TDEPT = b.dataset.d; renderTop(); });
  const x = document.getElementById('tXlsx'); if (!x) return;
  x.onclick = () => {
    const head = ['Rank','Brand','Score','Avg Basic','Avg Premium','Products','STAR products','Reward-only products'];
    const sheets = [{name:'How it is ranked', bold:[0], widths:[60], rows:[['Top Points brands'], [`Score = ${Math.round(TOP.wBasic*100)}% Basic + ${Math.round(TOP.wPrem*100)}% Premium (if only one exists it is used as is)`], ['Brand score = average score of its products'], ['Same score: brand with more products ranks first'], [`Updated ${C.dateLabel}`]]}];
    TOPDEPTS.forEach(dn => sheets.push({name:dn.replace(/[\[\]:*?\/\\]/g,'').slice(0,31), freeze:true, bold:[0], widths:[7,28,9,11,13,10,14,20],
      rows:[head, ...TOP.depts[dn].brands.map((b,i) => [i+1, b[0], b[1], b[2], b[3], b[4], b[5], b[6]])]}));
    dl(buildXlsx(sheets), `Star_List_Top_Points_${STAMP}.xlsx`);
  };
  document.getElementById('tCsv').onclick = () => {
    const q = v => { v = v ?? ''; v = String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; };
    const lines = [['Rank','Brand','Score','Avg Basic','Avg Premium','Products','STAR products','Reward-only products'], ...topRows().map(r => [r.rank,r.brand,r.score,r.basic,r.prem,r.skus,r.star,r.rew])];
    dl(new Blob(['\ufeff' + lines.map(r => r.map(q).join(',')).join('\r\n')], {type:'text/csv;charset=utf-8'}), `Top_Points_${TDEPT.replace(/[^A-Za-z0-9]+/g,'-')}_${STAMP}.csv`);
  };
  document.getElementById('tPng').onclick = exportTopPng;
}
async function exportTopPng(){
  try { await document.fonts.ready; } catch(e) {}
  const rows = topRows(), W = 1100, rh = 40, H = 230 + 50 + rows.length * rh + 70;
  const cv = document.createElement('canvas'), k = 2; cv.width = W * k; cv.height = H * k;
  const x = cv.getContext('2d'); x.scale(k, k);
  const F = (s, w, serif) => `${w || 400} ${s}px ${serif ? 'Fraunces, Georgia, serif' : 'Inter, Arial, sans-serif'}`;
  x.fillStyle = '#F4F4F2'; x.fillRect(0,0,W,H);
  x.fillStyle = '#231F20'; x.fillRect(0,0,W,170); x.fillStyle = '#FBD729'; x.fillRect(0,170,W,6);
  x.fillStyle = '#FBD729'; rr(x, 45, 35, 100, 100, 22); x.fill();
  try { x.drawImage(document.getElementById('logo'), 55, 45, 80, 80); } catch(e) {}
  x.fillStyle = '#FBD729'; x.font = F(38, 700, 1); x.fillText(`Top Points brands: ${TDEPT}`, 170, 90);

/* ---------- Exports ---------- */
function dl(blob, name){
  const u = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 4000);
}
const STAMP = C.dateIso;

function exportCsv(rows){
  let head, line;
  if (S.cview === 'points') { head = ['SAP Code','Product','Department','Brand','Old Basic','New Basic','Old Total','New Total'];
    line = p => { const o = OLDPTS.get(p.sap); return [p.sap,p.name,p.division,p.brand,o.basic,p.basic,o.total,p.total]; }; }
  else { head = ['SAP Code','Product','Department','Brand','Basic Points','Total Points'];
    line = p => [p.sap,p.name,p.division,p.brand,p.basic,p.total]; }
  const q = v => { v = v ?? ''; v = String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; };
  const csv = '\ufeff' + [head, ...rows.map(line)].map(r => r.map(q).join(',')).join('\r\n');
  const suffix = S.cdiv === 'All' ? '' : '_' + S.cdiv.replace(/[^A-Za-z0-9]+/g,'-');

}

/* Minimal XLSX writer (no external library) */
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u){ let c = 0xFFFFFFFF; for (let i = 0; i < u.length; i++) c = CRC[(c ^ u[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function zip(files){
  const enc = new TextEncoder(), parts = [], cd = []; let off = 0;

    const nm = enc.encode(f.name), data = enc.encode(f.text), crc = crc32(data);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(12,0x21,true);
    h.setUint32(14,crc,true); h.setUint32(18,data.length,true); h.setUint32(22,data.length,true); h.setUint16(26,nm.length,true);
    parts.push(new Uint8Array(h.buffer), nm, data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(14,0x21,true);
    c.setUint32(16,crc,true); c.setUint32(20,data.length,true); c.setUint32(24,data.length,true); c.setUint16(28,nm.length,true); c.setUint32(42,off,true);
    cd.push(new Uint8Array(c.buffer), nm);
    off += 30 + nm.length + data.length;
  });
  const size = cd.reduce((s,a) => s + a.length, 0), e = new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true); e.setUint32(12,size,true); e.setUint32(16,off,true);
  return new Blob([...parts, ...cd, new Uint8Array(e.buffer)], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
const xe = s => String(s).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const colL = i => { let s = ''; i++; while (i) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; };
function sheetXml(sh){
  const NS = 'xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"';
  let x = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet ${NS}>`;
  if (sh.freeze) x += '<sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>';
  x += '<cols>' + sh.widths.map((w,i) => `<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('') + '</cols><sheetData>';
  sh.rows.forEach((r, ri) => {
    x += `<row r="${ri+1}">`;
    r.forEach((v, ci) => {
      if (!has(v)) return;
      const ref = colL(ci) + (ri + 1), st = sh.bold.includes(ri) ? ' s="1"' : '';
      x += typeof v === 'number' ? `<c r="${ref}"${st}><v>${v}</v></c>` : `<c r="${ref}" t="inlineStr"${st}><is><t xml:space="preserve">${xe(v)}</t></is></c>`;
    });

function buildXlsx(sheets){
  const NS = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main', R = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  const files = [
    {name:'[Content_Types].xml', text:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((s,i) => `<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`},
    {name:'_rels/.rels', text:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${R}/officeDocument" Target="xl/workbook.xml"/></Relationships>`},
    {name:'xl/workbook.xml', text:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="${NS}" xmlns:r="${R}"><sheets>${sheets.map((s,i) => `<sheet name="${xe(s.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets></workbook>`},
    {name:'xl/_rels/workbook.xml.rels', text:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((s,i) => `<Relationship Id="rId${i+1}" Type="${R}/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length+1}" Type="${R}/styles" Target="styles.xml"/></Relationships>`},
    {name:'xl/styles.xml', text:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="${NS}"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFFBD729"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`}
  ];
  sheets.forEach((s,i) => files.push({name:`xl/worksheets/sheet${i+1}.xml`, text:sheetXml(s)}));

}
function deptSummary(){
  const m = {};
  const bump = (d,k) => { (m[d] || (m[d] = {added:0, removed:0, points:0}))[k]++; };
  P.forEach(p => { if (ADDED.has(p.sap)) bump(p.division,'added'); if (OLDPTS.has(p.sap)) bump(p.division,'points'); });
  REMOVED.forEach(p => bump(p.division,'removed'));
  return Object.entries(m).sort((a,b) => (b[1].added + b[1].removed) - (a[1].added + a[1].removed));
}
function exportXlsx(){
  const net = C.after - C.before, g = C.before ? net / C.before : 0;
  const ds = deptSummary();
  const sum = [['Star List monthly changes'], ['Last updated', C.dateLabel], [],
    ['Metric','Value'], ['Before', C.before], ['After', C.after], ['Added', C.added.length], ['Removed', C.removed.length],
    ['Net change', net], ['Growth %', Math.round(g * 1000) / 10], ['Points changed', C.points.length],
    ['Brands new to a department', C.newBrands.length], ['Brands that left a department', C.droppedBrands.length], [],
    ['Department','Added','Removed','Points changed','Net'], ...ds.map(([d,x]) => [d, x.added, x.removed, x.points, x.added - x.removed])];
  const nb = p => NEWBRAND.has(key(p.division, p.brand)) ? 'Yes' : '';
  const db = p => DROPBRAND.has(key(p.division, p.brand)) ? 'Yes' : '';
  const srt = a => a.slice().sort((x,y) => x.division.localeCompare(y.division) || x.brand.localeCompare(y.brand) || x.name.localeCompare(y.name));
  const sheets = [
    {name:'Summary', rows:sum, bold:[0,3,14], widths:[32,16,12,16,10]},
    {name:'Added', freeze:true, bold:[0], widths:[11,50,18,24,11,11,12], rows:[['SAP Code','Product','Department','Brand','Basic Pts','Total Pts','New Brand'], ...srt(VIEWS.added.rows()).map(p => [p.sap,p.name,p.division,p.brand,p.basic,p.total,nb(p)])]},
    {name:'Removed', freeze:true, bold:[0], widths:[11,50,18,24,11,11,22], rows:[['SAP Code','Product','Department','Brand','Basic Pts','Total Pts','Brand Left Department'], ...srt(REMOVED).map(p => [p.sap,p.name,p.division,p.brand,p.basic,p.total,db(p)])]},
    {name:'Points Changed', freeze:true, bold:[0], widths:[11,50,18,24,10,10,10,10], rows:[['SAP Code','Product','Department','Brand','Old Basic','New Basic','Old Total','New Total'], ...srt(VIEWS.points.rows()).map(p => { const o = OLDPTS.get(p.sap); return [p.sap,p.name,p.division,p.brand,o.basic,p.basic,o.total,p.total]; })]},
    {name:'Brands Entered', freeze:true, bold:[0], widths:[28,20,10], rows:[['Brand','Department','SKUs'], ...C.newBrands]},
    {name:'Brands Exited', freeze:true, bold:[0], widths:[28,20,12], rows:[['Brand','Department','SKUs Before'], ...C.droppedBrands]}
  ];
  dl(buildXlsx(sheets), `Star_List_Changes_${STAMP}.xlsx`);
}

/* Summary image */
function rr(ctx, x, y, w, h, r){ const R = typeof r === 'number' ? [r,r,r,r] : r; ctx.beginPath(); ctx.moveTo(x+R[0],y); ctx.lineTo(x+w-R[1],y); ctx.quadraticCurveTo(x+w,y,x+w,y+R[1]); ctx.lineTo(x+w,y+h-R[2]); ctx.quadraticCurveTo(x+w,y+h,x+w-R[2],y+h); ctx.lineTo(x+R[3],y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-R[3]); ctx.lineTo(x,y+R[0]); ctx.quadraticCurveTo(x,y,x+R[0],y); ctx.closePath(); }
async function exportPng(){

  const ds = deptSummary(), W = 1200, rowH = 44, H = 400 + 60 + ds.length * rowH + 80;
  const cv = document.createElement('canvas'), k = 2; cv.width = W * k; cv.height = H * k;

  const f = (t,s,w) => t.replace('{s}', s).replace('{w}', w || 400);
  x.fillStyle = '#F4F4F2'; x.fillRect(0,0,W,H);
  x.fillStyle = '#FBD729'; x.fillRect(0,0,W,170); x.fillStyle = '#231F20'; x.fillRect(0,170,W,6);
  rr(x, 50, 35, 100, 100, 22); x.fill();
  const lg = document.getElementById('logo'); try { x.drawImage(lg, 60, 45, 80, 80); } catch(e) {}
  x.fillStyle = '#231F20'; x.font = f(SER, 42); x.fillText('Star List monthly changes', 180, 92);
  x.font = f(SAN, 19, 500); x.fillStyle = '#4A4546'; x.fillText(`Last updated ${C.dateLabel}, compared with the previous list`, 180, 128);
  const net = C.after - C.before, g = C.before ? net / C.before * 100 : 0;
  const cards = [['Before', fmt(C.before), '#231F20'], ['After', fmt(C.after), '#231F20'], ['Added', '+' + fmt(C.added.length), '#146B3E'],
    ['Removed', '−' + fmt(C.removed.length), '#B3261E'], ['Net change', (net >= 0 ? '+' : '−') + fmt(Math.abs(net)), net >= 0 ? '#146B3E' : '#B3261E'],
    ['Growth', (g >= 0 ? '+' : '−') + Math.abs(g).toFixed(1) + '%', g >= 0 ? '#146B3E' : '#B3261E']];
  const cw = (W - 100 - 5 * 14) / 6;

    x.fillStyle = '#231F20'; rr(x, cx, cy, cw, 128, [18,18,18,4]); x.fill();
    x.fillStyle = '#FBD729'; rr(x, cx, cy, cw, 123, [18,18,18,4]); x.fill();
    x.fillStyle = '#231F20'; x.save(); x.translate(cx + cw - 22, cy + 22); x.rotate(Math.PI / 4); x.fillRect(-5,-5,10,10); x.restore();
    x.fillStyle = '#4A4546'; x.font = f(SAN, 16, 600); x.fillText(c[0], cx + 16, cy + 34);
    x.fillStyle = c[2]; x.font = f(SER, 34); x.fillText(c[1], cx + 16, cy + 92);
  });
  let y = 395;
  x.fillStyle = '#231F20'; x.font = f(SER, 24); x.fillText('By department', 50, y);
  y += 22; const cols = [50, 520, 680, 840, 1030];
  x.fillStyle = '#FFF6C7'; x.fillRect(50, y, W - 100, rowH); x.fillStyle = '#231F20'; x.font = f(SAN, 15, 700);
  ['Department','Added','Removed','Points changed','Net'].forEach((t, i) => x.fillText(t, cols[i] + (i ? 0 : 14), y + 28));
  y += rowH;
  ds.forEach(([d, v], i) => {
    x.fillStyle = i % 2 ? '#FFFFFF' : '#FAFAF8'; x.fillRect(50, y, W - 100, rowH);
    x.font = f(SAN, 16, 500); x.fillStyle = '#231F20'; x.fillText(d, cols[0] + 14, y + 28);
    x.fillStyle = v.added ? '#146B3E' : '#77716F'; x.fillText(v.added ? '+' + fmt(v.added) : '0', cols[1], y + 28);
    x.fillStyle = v.removed ? '#B3261E' : '#77716F'; x.fillText(v.removed ? '−' + fmt(v.removed) : '0', cols[2], y + 28);

}
